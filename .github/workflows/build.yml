name: Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'baseline = 原样 Mika 基线; patch = 应用我们的补丁'
        required: false
        default: 'baseline'

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取我们的仓库（补丁所在）
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 取 Mika 源码
        run: |
          git clone --depth 1 https://github.com/wangzan101/Mika.git mika
          cd mika
          echo "Mika HEAD: $(git rev-parse --short=7 HEAD)"

      - name: 应用补丁
        id: apply
        if: github.event.inputs.mode == 'patch'
        continue-on-error: true
        run: |
          if [ -f repo/patch/apply.sh ]; then
            cd mika
            set +e
            BUILD_NUMBER=${{ github.run_number }} bash ../repo/patch/apply.sh 2>&1 | tee /tmp/apply.log
            rc=${PIPESTATUS[0]}
            set -e
            echo "rc=$rc" >> $GITHUB_OUTPUT
            exit $rc
          else
            echo "repo/patch/apply.sh 不存在，按原样构建"
            echo "rc=0" >> $GITHUB_OUTPUT
          fi

      - name: 补丁失败时把日志写回仓库
        if: steps.apply.outputs.rc != '0'
        run: |
          mkdir -p repo/logs
          {
            echo "# 补丁失败 run ${{ github.run_number }}"
            echo "日期: $(date -u +%Y-%m-%d)"
            echo
            echo '```'
            tail -60 /tmp/apply.log
            echo '```'
          } > repo/logs/patch-${{ github.run_number }}.md
          cd repo
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          git add -f logs
          git diff --cached --quiet && echo "无变化" || (git commit -m "patch 失败日志 run ${{ github.run_number }}" && git push)
          exit 1

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建 Debug
        id: gradle
        continue-on-error: true
        run: |
          cd mika
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: 失败时把日志写回仓库（沙盒下不了 Actions 日志）
        if: steps.gradle.outputs.exit != '0'
        run: |
          cd mika
          mkdir -p ../repo/logs
          {
            echo "# 构建失败日志 run ${{ github.run_number }}"
            echo "日期: $(date -u +%Y-%m-%d)"
            echo
            echo '## 报错行（e: 开头 + 前后各几行上下文）'
            echo '```'
            grep -n -E '^e:|^.*error:|Unresolved reference|Expecting|is not a function|Caused by' /tmp/gradle.log \
              | head -60
            echo '```'
            echo
            echo
            echo '## 诊断：SettingsScreen 签名与 onOpenLocalModel 出现次数'
            echo '```'
            echo "count=$(grep -c onOpenLocalModel app/src/main/java/com/wangzan101/mika/ui/SettingsScreen.kt)"
            sed -n '/^fun SettingsScreen(/,/^) {/p' app/src/main/java/com/wangzan101/mika/ui/SettingsScreen.kt
            echo '--- 310 行附近 ---'
            sed -n '305,320p' app/src/main/java/com/wangzan101/mika/ui/SettingsScreen.kt
            echo '```'
            echo '## 最后 200 行'
            echo '```'
            tail -200 /tmp/gradle.log
            echo '```'
          } > ../repo/logs/build-${{ github.run_number }}.md
          cd ../repo
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          git add -f logs
          git diff --cached --quiet && echo "无变化" || (git commit -m "logs: run ${{ github.run_number }} 失败" && git push)
          exit 1

      - name: 收产物
        run: |
          mkdir -p repo/prebuilt
          find mika/app/build/outputs -name '*.apk' -exec cp {} repo/prebuilt/ \;
          ls -la repo/prebuilt
          {
            echo "# 本次构建的 APK 内容（run ${{ github.run_number }}, $(date -u +%Y-%m-%d)）"
            echo
            echo "APK 体积: $(stat -c%s repo/prebuilt/app-debug.apk 2>/dev/null) 字节"
            echo
            echo '## lib/ 下的原生库'
            echo '```'
            unzip -l repo/prebuilt/app-debug.apk | grep -E 'lib/.*\.so' || echo "（没有 .so）"
            echo '```'
          } > repo/prebuilt/apk-libs.md

      - name: 上传 APK 到 Release（绕开 git 单文件 100 MiB 上限）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          # git 的 pre-receive hook 拒收 >100 MiB 的 blob；Release 附件上限 2 GB。
          # 固定用 latest 这个 tag，--clobber 覆盖，用户下载链接永久不变。
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新构建" --notes "CI 自动构建，每次覆盖" --prerelease
          gh release upload latest prebuilt/app-debug.apk --clobber
          echo "下载：https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk"

      - name: APK 自检（防止用户装到坏包）
        run: |
          # build-tools 可能有多个版本，通配符会展开成多个路径被当成参数，这里只取一个
          BT=$(ls -d ${ANDROID_HOME}/build-tools/*/ | tail -1)
          cd repo/prebuilt
          APK=app-debug.apk
          {
            echo "## APK 自检"
            echo
            echo "体积: $(stat -c%s $APK) 字节"
            echo
            echo "### zip 完整性"
            echo '```'
            unzip -t "$APK" >/tmp/zipt.log 2>&1 && echo "OK：全部条目 CRC 校验通过" || echo "❌ 有条目损坏"
            tail -3 /tmp/zipt.log
            echo '```'
            echo
            echo "### aapt 能否解析（packageInfo 就是这里出的）"
            echo '```'
            "$BT/aapt" dump badging "$APK" 2>&1 | head -12
            echo '```'
            echo
            echo "### 签名是否完整"
            echo '```'
            "$BT/apksigner" verify --print-certs "$APK" 2>&1 | head -10
            echo '```'
          } >> apk-libs.md
          echo "--- 自检结果 ---"
          tail -40 apk-libs.md

      - name: 提交回仓库
        id: publish
        continue-on-error: true
        run: |
          cd repo
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          : > /tmp/pub.log
          set +e
          # ⚠️ 不要 add prebuilt/app-debug.apk：它 >100 MiB 会被 GitHub 拒收。
          # APK 走上面的 Release 附件，这里只提交小文件。
          git add -f prebuilt/apk-libs.md keystore.jks 2>&1 | tee -a /tmp/pub.log
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交" | tee -a /tmp/pub.log
            echo "rc=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "build ${{ github.run_number }} (${{ github.event.inputs.mode }})" 2>&1 | tee -a /tmp/pub.log
          # 构建跑了几分钟，远端很可能被别的提交推进过（比如上传补丁）→ 先同步再推
          git fetch origin main 2>&1 | tee -a /tmp/pub.log
          git rebase origin/main 2>&1 | tee -a /tmp/pub.log || {
            echo "rebase 冲突，放弃" | tee -a /tmp/pub.log
            git rebase --abort 2>&1 | tee -a /tmp/pub.log
          }
          git push origin HEAD:main 2>&1 | tee -a /tmp/pub.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> $GITHUB_OUTPUT
          exit $rc

      - name: 提交失败时把日志写回仓库
        if: steps.publish.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd repo
          mkdir -p logs
          {
            echo "# 提交失败 run ${{ github.run_number }}"
            echo
            echo '```'
            tail -60 /tmp/pub.log
            echo '```'
          } > logs/publish-${{ github.run_number }}.md
          # 用 API 直接写小文件：万一 push 这条路整个不通，日志也能拿回来
          gh api "repos/${{ github.repository }}/contents/logs/publish-${{ github.run_number }}.md" \
            -X PUT -f message="提交失败日志 run ${{ github.run_number }}" \
            -f content="$(base64 -w0 logs/publish-${{ github.run_number }}.md)" || true
          exit 1
