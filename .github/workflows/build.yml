name: Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'baseline = 原样 Mika 基线; patch = 应用我们的补丁'
        required: false
        default: 'baseline'

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取我们的仓库（补丁所在）
        uses: actions/checkout@v4
        with:
          path: repo

      - name: 取 Mika 源码
        run: |
          git clone --depth 1 https://github.com/wangzan101/Mika.git mika
          cd mika
          echo "Mika HEAD: $(git rev-parse --short=7 HEAD)"
          echo "$GITHUB_STEP_SUMMARY"

      - name: 应用补丁
        if: github.event.inputs.mode == 'patch'
        run: |
          if [ -f repo/patch/apply.sh ]; then
            cd mika
            BUILD_NUMBER=${{ github.run_number }} bash ../repo/patch/apply.sh
          else
            echo "repo/patch/apply.sh 不存在，按原样构建"
          fi

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建 Debug
        run: |
          cd mika
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        timeout-minutes: 45

      - name: 收产物
        run: |
          mkdir -p repo/prebuilt
          find mika/app/build/outputs -name '*.apk' -exec cp {} repo/prebuilt/ \;
          ls -la repo/prebuilt
          {
            echo "# 本次构建的 APK 内容（run ${{ github.run_number }}, $(date -u +%Y-%m-%d)）"
            echo
            echo "APK 体积: $(stat -c%s repo/prebuilt/app-debug.apk 2>/dev/null) 字节"
            echo
            echo '## lib/ 下的原生库'
            echo '```'
            unzip -l repo/prebuilt/app-debug.apk | grep -E 'lib/.*\.so' || echo "（没有 .so）"
            echo '```'
          } > repo/prebuilt/apk-libs.md

      - name: 提交回仓库
        run: |
          cd repo
          git config user.name "builder"
          git config user.email "builder@users.noreply.github.com"
          git add -f prebuilt keystore.jks
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "build ${{ github.run_number }} (${{ github.event.inputs.mode }})"
            git push
          fi
