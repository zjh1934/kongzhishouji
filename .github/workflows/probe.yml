name: Probe

on:
  workflow_dispatch:
    inputs:
      what:
        description: 'ms = 核实魔搭上有没有这些 GGUF'
        required: false
        default: 'ms'

permissions:
  contents: write

jobs:
  ms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 查魔搭上有没有候选 GGUF 仓库
        run: |
          out=probe-result/modelscope-gguf.md
          mkdir -p probe-result
          echo "# 魔搭上的端侧模型 GGUF 可用性" > $out
          echo "查询日期: $(date -u +%Y-%m-%d)" >> $out
          echo >> $out
          echo '```' >> $out
          for q in "MAI-UI" "GUI-Owl" "Qwen3-VL-4B" ; do
            echo "=== 搜索: $q ===" >> $out
            curl -sSL --max-time 30 \
              "https://www.modelscope.cn/api/v1/models/?Name=$q&PageSize=20" \
              -o /tmp/ms.json 2>/dev/null
            python3 - <<'PYEOF' >> $out
import json
try:
    d = json.load(open('/tmp/ms.json'))
except Exception as e:
    print('  读取失败:', e); raise SystemExit
items = d.get('Data', {}).get('Models', []) if isinstance(d.get('Data'), dict) else []
if not items:
    print('  （没搜到）')
for m in items:
    name = m.get('Name') or ''
    path = m.get('Path') or m.get('Id') or ''
    dl = m.get('Downloads') or 0
    print('  %-55s 下载量=%s' % (path or name, dl))
PYEOF
          done
          echo '```' >> $out

      - name: 直接探几个可能的魔搭仓库
        run: |
          out=probe-result/modelscope-gguf.md
          echo >> $out
          echo "## 直接探仓库文件（HTTP码 / 字节）" >> $out
          echo '```' >> $out
          probe() {
            url="$1"
            code=$(curl -sIL --max-time 25 -o /dev/null -w "%{http_code}" "$url")
            sz=$(curl -sIL --max-time 25 "$url" | grep -i '^content-length:' | tail -1 | tr -d '\r' | awk '{print $2}')
            echo "$code  ${sz:-未知}  $url" >> $out
          }
          probe "https://www.modelscope.cn/api/v1/models/mradermacher/MAI-UI-2B-GGUF/repo?Revision=master&FilePath=MAI-UI-2B.Q4_K_M.gguf"
          probe "https://www.modelscope.cn/api/v1/models/mradermacher/GUI-Owl-1.5-4B-Instruct-GGUF/repo?Revision=master&FilePath=GUI-Owl-1.5-4B-Instruct.Q4_K_M.gguf"
          probe "https://www.modelscope.cn/api/v1/models/unsloth/Qwen3-VL-4B-Instruct-GGUF/repo?Revision=master&FilePath=Qwen3-VL-4B-Instruct-Q4_K_M.gguf"
          echo '```' >> $out

      - name: 提交回仓库
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add -f probe-result
          git diff --cached --quiet && echo "无变化" || (git commit -m "probe: 魔搭可用性 $(date -u +%F)" && git push)
