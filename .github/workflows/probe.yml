name: Probe

# 沙盒访问不到 huggingface.co / modelscope，用 CI 当眼睛去核实文件的确切名字和大小。
# 大文件下载链接写错一个字符就是白下几 GB，所以必须逐字核实。
on:
  workflow_dispatch:
    inputs:
      what:
        description: 'models = 核实端侧模型文件; packaging = llama.cpp 打包'
        required: false
        default: 'models'

permissions:
  contents: write

jobs:
  models:
    if: github.event.inputs.what == 'models'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 列出候选仓库的确切文件名与大小
        run: |
          mkdir -p probe-result
          out=probe-result/model-files.md
          echo "# 端侧 GUI Agent 模型：确切文件名与大小" > $out
          echo "查询日期: $(date -u +%Y-%m-%d)" >> $out
          echo >> $out

          list() {
            repo="$1"
            echo "### $repo" >> $out
            echo '```' >> $out
            curl -sSL "https://huggingface.co/api/models/$repo" \
              | python3 -c "
import sys, json
d = json.load(sys.stdin)
if 'error' in d or 'siblings' not in d:
    print('  未找到或无法访问:', d.get('error', d))
else:
    sib = [s['rfilename'] for s in d.get('siblings', [])]
    gg = [f for f in sib if f.endswith('.gguf')]
    print('  文件总数:', len(sib))
    for f in sorted(gg):
        print('  ', f)
"
            echo '```' >> $out
            echo >> $out
          }

          mkdir -p probe-result
          out=probe-result/model-files.md
          echo "# 端侧 GUI Agent 模型：确切文件名与大小" > $out
          echo "查询日期: $(date -u +%Y-%m-%d)" >> $out
          echo >> $out
          list "mradermacher/MAI-UI-2B-GGUF"
          list "mPLUG/GUI-Owl-1.5-4B-Instruct"
          list "iic/GUI-Owl-1.5-4B-Instruct"
          list "mradermacher/GUI-Owl-1.5-4B-Instruct-GGUF"
          list "lmstudio-community/UI-TARS-2B-SFT-GGUF"
          list "Qwen/Qwen3-VL-4B-Instruct-GGUF"

      - name: 试着 HEAD 几个候选直链，看大小
        run: |
          out=probe-result/model-files.md
          echo "## 直链 HEAD 实测（content-length 字节）" >> $out
          echo '```' >> $out
          check() {
            url="$1"
            sz=$(curl -sIL --max-time 25 "$url" | grep -i '^content-length:' | tail -1 | tr -d '\r' | awk '{print $2}')
            code=$(curl -sIL --max-time 25 -o /dev/null -w "%{http_code}" "$url")
            echo "$code  ${sz:-?}  $url" >> $out
          }
          check "https://huggingface.co/mradermacher/MAI-UI-2B-GGUF/resolve/main/MAI-UI-2B-Q4_K_M.gguf"
          check "https://huggingface.co/mradermacher/MAI-UI-2B-GGUF/resolve/main/mmproj-Q8_0.gguf"
          check "https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/Qwen3-VL-4B-Instruct-Q4_K_M.gguf"
          check "https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/mmproj-F16.gguf"
          echo '```' >> $out

      - name: 提交回仓库
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add -f probe-result
          git diff --cached --quiet && echo "无变化" || (git commit -m "probe: 模型文件清单 $(date -u +%F)" && git push)

  packaging:
    if: github.event.inputs.what == 'packaging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 老逻辑占位（暂不删，免得改坏）
        run: echo "packaging probe 已合并进 models，暂不需要"
