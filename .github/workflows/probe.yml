name: Probe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'llama.cpp release tag'
        required: false
        default: 'b12032'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 下载并解包
        run: |
          mkdir -p probe && cd probe
          curl -sSL -o android.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${{ github.event.inputs.tag }}/llama-${{ github.event.inputs.tag }}-bin-android-arm64.tar.gz"
          mkdir -p x && tar xzf android.tar.gz -C x
          ls x/

      - name: 找能 strip aarch64 的工具
        run: |
          echo "llvm-strip: $(which llvm-strip || echo 无)"
          echo "aarch64-linux-gnu-strip: $(which aarch64-linux-gnu-strip || echo 无)"
          llvm-strip --version 2>/dev/null | head -2 || true

      - name: strip 全部 so（用 llvm-strip）
        run: |
          cd probe
          mkdir -p stripped
          SRC="x/llama-b12032"
          STRIP=$(which llvm-strip)
          [ -z "$STRIP" ] && { sudo apt-get update -qq; sudo apt-get install -y -qq binutils-aarch64-linux-gnu; STRIP=aarch64-linux-gnu-strip; }
          echo "用: $STRIP"
          ls "$SRC" | head -50
          for f in "$SRC"/*.so; do
            n=$(basename "$f")
            cp "$f" "stripped/$n"
            "$STRIP" --strip-unneeded "stripped/$n" 2>&1 | head -2 || true
          done
          cp "$SRC/llama-server" stripped/llama-server
          "$STRIP" --strip-unneeded stripped/llama-server 2>&1 | head -2 || true
          echo "--- strip 完成 ---"

      - name: 体积对比表
        run: |
          cd probe
          SRC="x/llama-b12032"
          NEEDED="llama-server libllama-server-impl.so libllama-common.so libllama.so libmtmd.so libggml.so libggml-base.so libggml-rpc.so"
          NEEDED="$NEEDED libggml-cpu-android_armv8.0_1.so libggml-cpu-android_armv8.2_1.so libggml-cpu-android_armv8.2_2.so"
          NEEDED="$NEEDED libggml-cpu-android_armv8.6_1.so libggml-cpu-android_armv9.0_1.so libggml-cpu-android_armv9.2_1.so libggml-cpu-android_armv9.2_2.so"
          echo "| 文件 | 原始 | strip后 |" > size.md
          echo "|---|---:|---:|" >> size.md
          TA=0; TB=0
          for f in $NEEDED; do
            a=$(stat -c%s "$SRC/$f" 2>/dev/null || echo 0)
            b=$(stat -c%s "stripped/$f" 2>/dev/null || echo 0)
            TA=$((TA+a)); TB=$((TB+b))
            echo "| $f | $a | $b |" >> size.md
          done
          echo "" >> size.md
          echo "**服务端最小集合计：原始 $TA → strip 后 $TB（$((TB*100/TA))%）**" >> size.md
          cat size.md

      - name: qemu 冒烟测试：能不能真跑起来
        run: |
          set +e
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq qemu-user-static >/dev/null 2>&1
          cd probe/stripped
          Q=$(which qemu-aarch64-static || which qemu-aarch64)
          echo "qemu: ${Q:-无}"
          if [ -n "$Q" ]; then
            echo "=== --help 前 25 行 ==="
            LD_LIBRARY_PATH=. timeout 90 "$Q" ./llama-server --help 2>&1 | head -25
            echo "=== 退出码 ${PIPESTATUS[0]} ==="
          fi

      - name: 结果写回
        run: |
          cd probe
          {
            echo "# llama.cpp android-arm64 打包可行性（${{ github.event.inputs.tag }}）"
            echo "日期: $(date -u +%Y-%m-%d)"
            echo
            cat size.md
          } > ../probe-result/packaging.md
          cd ..
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add -f probe-result
          git diff --cached --quiet && echo "无变化" || (git commit -m "probe: strip 体积 ${{ github.event.inputs.tag }}" && git push)
