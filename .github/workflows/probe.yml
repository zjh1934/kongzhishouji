name: Probe

on:
  workflow_dispatch:
    inputs:
      what:
        description: 'ms = 核实魔搭上的 GGUF 可用性'
        required: false
        default: 'ms'

permissions:
  contents: write

jobs:
  ms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 搜魔搭：有没有这些模型的镜像
        run: |
          out=probe-result/modelscope-gguf.md
          mkdir -p probe-result
          echo "# 魔搭上的端侧模型 GGUF 可用性" > $out
          echo "查询日期: $(date -u +%Y-%m-%d)" >> $out
          echo >> $out
          for q in MAI-UI GUI-Owl Qwen3-VL-4B ; do
            echo "=== 搜索 $q ===" >> $out
            echo '```' >> $out
            curl -sSL --max-time 30 "https://www.modelscope.cn/api/v1/dolphin/models?Name=$q&PageSize=20" -o /tmp/ms_$q.json
            grep -o '"Path":"[^"]*"' /tmp/ms_$q.json | sed 's/"Path":"//; s/"$//' | sort >> $out
            grep -o '"Name":"[^"]*"' /tmp/ms_$q.json | sed 's/"Name":"//; s/"$//' | sort | head -20 >> $out
            echo '```' >> $out
            echo >> $out
          done

      - name: 直接探可能的魔搭仓库
        run: |
          out=probe-result/modelscope-gguf.md
          echo "## 直接探仓库（HTTP码 / 字节）" >> $out
          echo '```' >> $out
          for url in \
            "https://www.modelscope.cn/api/v1/models/mradermacher/MAI-UI-2B-GGUF/repo?Revision=master&FilePath=MAI-UI-2B.Q4_K_M.gguf" \
            "https://www.modelscope.cn/api/v1/models/mradermacher/GUI-Owl-1.5-4B-Instruct-GGUF/repo?Revision=master&FilePath=GUI-Owl-1.5-4B-Instruct.Q4_K_M.gguf" \
            "https://www.modelscope.cn/api/v1/models/unsloth/Qwen3-VL-4B-Instruct-GGUF/repo?Revision=master&FilePath=Qwen3-VL-4B-Instruct-Q4_K_M.gguf" \
            "https://www.modelscope.cn/api/v1/models/Qwen/Qwen3-VL-4B-Instruct-GGUF/repo?Revision=master&FilePath=mmproj-Qwen3VL-4B-Instruct-F16.gguf" ; do
            code=$(curl -sIL --max-time 25 -o /dev/null -w "%{http_code}" "$url")
            sz=$(curl -sIL --max-time 25 "$url" | grep -i '^content-length:' | tail -1 | tr -d '\r' | awk '{print $2}')
            echo "$code  ${sz:-未知}  $url" >> $out
          done
          echo '```' >> $out

      - name: 提交回仓库
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add -f probe-result
          git diff --cached --quiet && echo "无变化" || (git commit -m "probe: 魔搭可用性 $(date -u +%F)" && git push)
