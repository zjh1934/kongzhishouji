name: Probe

# 沙盒访问不到 huggingface.co / modelscope，用 CI 当眼睛去核实文件的确切名字和大小。
# 大文件下载链接写错一个字符就是白下几 GB，所以必须逐字核实。
on:
  workflow_dispatch:
    inputs:
      what:
        description: 'models = 核实端侧模型文件'
        required: false
        default: 'models'

permissions:
  contents: write

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 列出候选仓库里的 gguf 文件
        run: |
          out=probe-result/model-files.md
          mkdir -p probe-result
          echo "# 端侧 GUI Agent 模型：确切文件名" > $out
          echo "查询日期: $(date -u +%Y-%m-%d)" >> $out
          echo >> $out
          for repo in \
            mradermacher/MAI-UI-2B-GGUF \
            mPLUG/GUI-Owl-1.5-4B-Instruct \
            iic/GUI-Owl-1.5-4B-Instruct \
            mradermacher/GUI-Owl-1.5-4B-Instruct-GGUF \
            lmstudio-community/UI-TARS-2B-SFT-GGUF \
            Qwen/Qwen3-VL-4B-Instruct-GGUF ; do
            echo "### $repo" >> $out
            echo '```' >> $out
            curl -sSL --max-time 30 "https://huggingface.co/api/models/$repo" \
              | grep -o '"rfilename":"[^"]*"' \
              | sed 's/"rfilename":"//; s/"$//' \
              | grep -i 'gguf' \
              | sort >> $out
            echo '```' >> $out
            echo >> $out
          done

      - name: HEAD 几个候选直链看真实大小
        run: |
          out=probe-result/model-files.md
          echo "## 直链实测（HTTP码 / content-length 字节）" >> $out
          echo '```' >> $out
          for url in \
            "https://huggingface.co/mradermacher/MAI-UI-2B-GGUF/resolve/main/MAI-UI-2B-Q4_K_M.gguf" \
            "https://huggingface.co/mradermacher/MAI-UI-2B-GGUF/resolve/main/mmproj-Q8_0.gguf" \
            "https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/Qwen3-VL-4B-Instruct-Q4_K_M.gguf" \
            "https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/mmproj-F16.gguf" ; do
            code=$(curl -sIL --max-time 30 -o /dev/null -w "%{http_code}" "$url")
            sz=$(curl -sIL --max-time 30 "$url" | grep -i '^content-length:' | tail -1 | tr -d '\r' | awk '{print $2}')
            echo "$code  ${sz:-未知}  $url" >> $out
          done
          echo '```' >> $out

      - name: 提交回仓库
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add -f probe-result
          git diff --cached --quiet && echo "无变化" || (git commit -m "probe: 模型文件清单 $(date -u +%F)" && git push)
