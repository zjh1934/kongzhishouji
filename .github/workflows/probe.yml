name: Probe

# 沙盒访问不到 github.com，用 CI 当眼睛。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'llama.cpp release tag'
        required: false
        default: 'b12032'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 下载并解包
        run: |
          mkdir -p probe && cd probe
          curl -sSL -o android.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${{ github.event.inputs.tag }}/llama-${{ github.event.inputs.tag }}-bin-android-arm64.tar.gz"
          mkdir -p x && tar xzf android.tar.gz -C x
          echo "解包完成"

      - name: 是否已经 strip + 文件类型
        run: |
          cd probe/x/llama-b12032
          for f in llama-server libllama.so libmtmd.so libggml.so libggml-base.so libllama-server-impl.so libllama-common.so; do
            echo "--- $f ---"
            file "$f" 2>/dev/null | cut -c1-200
          done

      - name: strip 后体积对比（服务端最小集）
        run: |
          cd probe/x/llama-b12032
          mkdir -p ../stripped
          NEEDED="llama-server libllama-server-impl.so libllama-common.so libllama.so libmtmd.so libggml.so libggml-base.so libggml-rpc.so"
          NEEDED="$NEEDED libggml-cpu-android_armv8.0_1.so libggml-cpu-android_armv8.2_1.so libggml-cpu-android_armv8.2_2.so"
          NEEDED="$NEEDED libggml-cpu-android_armv8.6_1.so libggml-cpu-android_armv9.0_1.so libggml-cpu-android_armv9.2_1.so libggml-cpu-android_armv9.2_2.so"
          echo "| 文件 | 原始 | strip 后 |"
          echo "|---|---:|---:|"
          TOT_A=0; TOT_B=0
          for f in $NEEDED; do
            [ -f "$f" ] || continue
            a=$(stat -c%s "$f")
            cp "$f" "../stripped/$f"
            strip --strip-unneeded "../stripped/$f" 2>/dev/null || echo "  (strip 失败: $f)"
            b=$(stat -c%s "../stripped/$f")
            TOT_A=$((TOT_A+a)); TOT_B=$((TOT_B+b))
            echo "| $f | $a | $b |"
          done
          echo "合计: 原始 $TOT_A -> strip 后 $TOT_B"
          echo "$TOT_A" > ../tot_a.txt
          echo "$TOT_B" > ../tot_b.txt

      - name: 试试 qemu 跑一下（能不能真的执行）
        run: |
          set +e
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq qemu-user-static >/dev/null 2>&1
          cd probe/x/llama-b12032
          echo "=== qemu-aarch64 可用性 ==="
          which qemu-aarch64-static qemu-aarch64 2>/dev/null || echo "  （没装到 qemu）"
          Q=$(which qemu-aarch64-static || which qemu-aarch64)
          if [ -n "$Q" ]; then
            echo "=== llama-server --help ==="
            LD_LIBRARY_PATH=. timeout 60 "$Q" ./llama-server --help 2>&1 | head -30
            echo "=== 退出码: $? ==="
          fi

      - name: 结果写回仓库
        run: |
          mkdir -p probe-result
          cd probe
          {
            echo "# llama.cpp android-arm64 打包可行性（tag ${{ github.event.inputs.tag }}）"
            echo "查询日期: $(date -u +%Y-%m-%d)"
            echo
            echo "## 体积：原始 vs strip"
            echo
            echo "| 文件 | 原始 | strip 后 |"
            echo "|---|---:|---:|"
            NEEDED="llama-server libllama-server-impl.so libllama-common.so libllama.so libmtmd.so libggml.so libggml-base.so libggml-rpc.so"
            NEEDED="$NEEDED libggml-cpu-android_armv8.0_1.so libggml-cpu-android_armv8.2_1.so libggml-cpu-android_armv8.2_2.so"
            NEEDED="$NEEDED libggml-cpu-android_armv8.6_1.so libggml-cpu-android_armv9.0_1.so libggml-cpu-android_armv9.2_1.so libggml-cpu-android_armv9.2_2.so"
            for f in $NEEDED; do
              [ -f "x/llama-b12032/$f" ] || continue
              a=$(stat -c%s "x/llama-b12032/$f")
              b=$(stat -c%s "stripped/$f" 2>/dev/null || echo 0)
              echo "| $f | $a | $b |"
            done
            echo
            echo "**合计：原始 $(cat tot_a.txt 2>/dev/null) → strip 后 $(cat tot_b.txt 2>/dev/null)**"
            echo
            echo "## 文件类型"
            echo '```'
            for f in llama-server libllama.so libmtmd.so; do
              echo "--- $f ---"; file "x/llama-b12032/$f" 2>/dev/null | cut -c1-200
            done
            echo '```'
          } > ../probe-result/packaging.md
          cd ..
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add -f probe-result
          git diff --cached --quiet && echo "无变化" || (git commit -m "probe: 打包可行性 ${{ github.event.inputs.tag }}" && git push)
