name: Probe

# 纯粹当"眼睛"用：沙盒访问不到 github.com，但 Actions 可以。
# 用来看 llama.cpp 官方 android-arm64 预编译包里到底有什么。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'llama.cpp release tag'
        required: false
        default: 'b12032'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 下载 android-arm64 预编译包
        run: |
          mkdir -p probe && cd probe
          curl -sSL -o android.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${{ github.event.inputs.tag }}/llama-${{ github.event.inputs.tag }}-bin-android-arm64.tar.gz"
          ls -la android.tar.gz
          file android.tar.gz

      - name: 列出包内文件
        run: |
          cd probe
          echo "=== 全部条目 ===" 
          tar tzf android.tar.gz | sort
          echo
          echo "=== 体积（解出来看）==="
          mkdir -p x && tar xzf android.tar.gz -C x
          find x -type f -printf '%s\t%p\n' | sort -rn | head -40

      - name: 查视觉/多模态支持
        run: |
          cd probe
          echo "=== 含 mtmd / mmproj 的文件 ==="
          tar tzf android.tar.gz | grep -iE 'mtmd|mmproj|vision' || echo "  （文件名里没有）"
          echo
          echo "=== 在二进制里搜 mmproj / mtmd 字符串 ==="
          for f in $(find x -type f -name 'llama-server' -o -type f -name 'llama-cli' -o -type f -name 'libmtmd*'); do
            echo "--- $f ---"
            strings "$f" 2>/dev/null | grep -iE '^\-\-mmproj|--mmproj|mmproj' | sort -u | head -10 || true
          done

      - name: 把清单写回仓库
        run: |
          mkdir -p probe-result
          {
            echo "# llama.cpp android-arm64 预编译包清单"
            echo "tag: ${{ github.event.inputs.tag }}"
            echo "查询日期: $(date -u +%Y-%m-%d)"
            echo
            echo "压缩包体积: $(stat -c%s probe/android.tar.gz) 字节"
            echo
            echo '## 解包后各文件体积（降序）'
            echo '```'
            find probe/x -type f -printf '%s\t%P\n' | sort -rn
            echo '```'
            echo
            echo '## 只带服务端所需文件的合计'
            echo '```'
            find probe/x -type f \( -name 'llama-server' -o -name 'libllama.so' -o -name 'libmtmd.so' -o -name 'libggml*.so' \) -printf '%s\t%P\n' | sort -rn
            echo "---合计---"
            find probe/x -type f \( -name 'llama-server' -o -name 'libllama.so' -o -name 'libmtmd.so' -o -name 'libggml*.so' \) -printf '%s\n' | paste -sd+ | bc
            echo '```'
            echo
            echo '## 视觉/多模态证据'
            echo '```'
            echo "--- 文件名含 mtmd ---"
            tar tzf probe/android.tar.gz | grep -iE 'mtmd' || echo "  （无）"
            echo "--- llama-server 里的 mmproj 相关字符串 ---"
            strings probe/x/llama-b12032/llama-server 2>/dev/null | grep -i 'mmproj' | sort -u | head -20 || echo "  （无）"
            echo "--- libmtmd.so 导出符号（前 30）---"
            strings probe/x/llama-b12032/libmtmd.so 2>/dev/null | grep -E '^mtmd_' | sort -u | head -30 || echo "  （无）"
            echo '```'
          } > probe-result/android-arm64-files.md
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add -f probe-result
          git diff --cached --quiet && echo "无变化" || git commit -m "probe: android-arm64 清单 ${{ github.event.inputs.tag }}" && git push
