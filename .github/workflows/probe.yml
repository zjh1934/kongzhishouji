name: Probe

on:
  workflow_dispatch:
    inputs:
      what:
        description: 'sizes = 核实直链大小'
        required: false
        default: 'sizes'

permissions:
  contents: write

jobs:
  sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 用核实过的文件名 HEAD 直链
        run: |
          out=probe-result/model-sizes.md
          mkdir -p probe-result
          echo "# 直链实测（HTTP码 / 字节 / 人类可读）" > $out
          echo "查询日期: $(date -u +%Y-%m-%d)" >> $out
          echo >> $out
          echo '```' >> $out
          for url in \
            "https://huggingface.co/mradermacher/GUI-Owl-1.5-4B-Instruct-GGUF/resolve/main/GUI-Owl-1.5-4B-Instruct.Q4_K_M.gguf" \
            "https://huggingface.co/mradermacher/GUI-Owl-1.5-4B-Instruct-GGUF/resolve/main/GUI-Owl-1.5-4B-Instruct.mmproj-Q8_0.gguf" \
            "https://huggingface.co/mradermacher/MAI-UI-2B-GGUF/resolve/main/MAI-UI-2B.Q4_K_M.gguf" \
            "https://huggingface.co/mradermacher/MAI-UI-2B-GGUF/resolve/main/MAI-UI-2B.mmproj-Q8_0.gguf" \
            "https://huggingface.co/unsloth/Qwen3-VL-4B-Instruct-GGUF/resolve/main/Qwen3-VL-4B-Instruct-Q4_K_M.gguf" \
            "https://huggingface.co/unsloth/Qwen3-VL-4B-Instruct-GGUF/resolve/main/mmproj-F16.gguf" \
            "https://huggingface.co/lmstudio-community/UI-TARS-2B-SFT-GGUF/resolve/main/UI-TARS-2B-SFT-Q4_K_M.gguf" \
            "https://huggingface.co/lmstudio-community/UI-TARS-2B-SFT-GGUF/resolve/main/mmproj-model-f16.gguf" ; do
            code=$(curl -sIL --max-time 30 -o /dev/null -w "%{http_code}" "$url")
            sz=$(curl -sIL --max-time 30 "$url" | grep -i '^content-length:' | tail -1 | tr -d '\r' | awk '{print $2}')
            if [ -n "$sz" ] && [ "$sz" != "0" ]; then
              human=$(awk -v b="$sz" 'BEGIN{printf "%.2f GB", b/1073741824}')
            else
              human="未知"
            fi
            echo "$code  ${sz:-未知}  ($human)  $url" >> $out
          done
          echo '```' >> $out

      - name: 顺带看看 unsloth 仓库里到底有哪些 gguf
        run: |
          out=probe-result/model-sizes.md
          echo >> $out
          echo "## unsloth/Qwen3-VL-4B-Instruct-GGUF 的 gguf 文件" >> $out
          echo '```' >> $out
          curl -sSL --max-time 30 "https://huggingface.co/api/models/unsloth/Qwen3-VL-4B-Instruct-GGUF" \
            | grep -o '"rfilename":"[^"]*"' \
            | sed 's/"rfilename":"//; s/"$//' \
            | grep -i gguf | sort >> $out
          echo '```' >> $out

      - name: 提交回仓库
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add -f probe-result
          git diff --cached --quiet && echo "无变化" || (git commit -m "probe: 直链大小 $(date -u +%F)" && git push)
